auth_enabled: false
server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3300
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 3395
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
storage_config:
  filesystem:
    directory: /var/lib/loki/chunks
  tsdb_shipper:
    active_index_directory: /var/lib/loki/index
    cache_location: /var/lib/loki/index-cache
compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 2
  delete_request_store: filesystem
limits_config:
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 168h
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 2
  per_stream_rate_limit: 512KB
  per_stream_rate_limit_burst: 1MB
  max_entries_limit_per_query: 2000
  max_query_parallelism: 2
  tsdb_max_query_parallelism: 2
  split_queries_by_interval: 1h
querier:
  max_concurrent: 2
query_range:
  cache_results: false
chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: false
ingester:
  chunk_idle_period: 5m
  max_chunk_age: 1h
  wal:
    dir: /var/lib/loki/wal
    replay_memory_ceiling: 128MB
analytics:
  reporting_enabled: false
