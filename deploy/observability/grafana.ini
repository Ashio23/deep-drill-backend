[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3301
domain = grafana.elicloud.cl
root_url = https://grafana.elicloud.cl/
enforce_domain = true

[security]
admin_user = deepdrill-admin
admin_password = $__file{/run/credentials/grafana-server.service/admin-password}
secret_key = $__file{/run/credentials/grafana-server.service/secret-key}
cookie_secure = true
cookie_samesite = lax
allow_embedding = false
disable_gravatar = true

[users]
allow_sign_up = false
allow_org_create = false
default_theme = dark

[auth.anonymous]
enabled = false

[auth]
disable_login_form = false
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[plugins]
preinstall_disabled = true

[log]
mode = console
level = warn

[unified_alerting]
enabled = false

[explore]
enabled = true
